<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدير المهام</title></head>
<body>
<h2>مدير المهام</h2>
<select id="type"><option value="daily">يومية</option><option value="weekly">أسبوعية</option><option value="monthly">شهرية</option><option value="yearly">سنوية</option></select>
<input id="taskInput" placeholder="المهمة">
<input id="repeatCount" type="number" min="1" value="1" placeholder="التكرارات">
<button onclick="addTask()">إضافة</button>
<div id="daily"></div><div id="weekly"></div><div id="monthly"></div><div id="yearly"></div>
<script>
let tasks=JSON.parse(localStorage.getItem("tasks")||"[]");
function save(){localStorage.setItem("tasks",JSON.stringify(tasks))}
function addTask(){
let text=taskInput.value.trim(); if(!text)return;
let type=document.getElementById("type").value;
let r=parseInt(repeatCount.value)||1;
tasks.push({text,type,date:new Date().toISOString(),checks:Array(r).fill(false)});
taskInput.value="";repeatCount.value=1;save();render();}
function shouldShow(t){return true;}
function toggleCheck(i,j){tasks[i].checks[j]=!tasks[i].checks[j];save();}
function removeTask(i){tasks.splice(i,1);save();render();}
function createTaskElement(t,i){
return `<div><b>${t.text}</b><div>${t.checks.map((c,j)=>`<label><input type="checkbox" ${c?"checked":""} onchange="toggleCheck(${i},${j})"></label>`).join("")}</div><button onclick="removeTask(${i})">حذف</button></div><hr>`;
}
function render(){["daily","weekly","monthly","yearly"].forEach(k=>document.getElementById(k).innerHTML="");
tasks.forEach((t,i)=>document.getElementById(t.type).innerHTML+=createTaskElement(t,i));}
render();
</script></body></html>
