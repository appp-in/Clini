<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مدير المهام</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

h1 {
  margin-bottom: 20px;
}

.input-group {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

input, select {
  padding: 10px;
  border-radius: 8px;
  border: none;
}

button {
  background: #3b82f6;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #2563eb;
}

.task {
  background: #1e293b;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.checks {
  margin-top: 10px;
}

.checks input {
  transform: scale(1.3);
  margin: 3px;
}

.delete {
  background: red;
}
</style>

</head>

<body>

<div class="container">
  <h1>📋 مدير المهام</h1>

  <div class="input-group">
    <input id="taskInput" placeholder="اكتب المهمة..." />

    <select id="taskType">
      <option value="daily">يومية</option>
      <option value="weekly">أسبوعية</option>
      <option value="monthly">شهرية</option>
      <option value="yearly">سنوية</option>
    </select>

    <input id="repeatCount" type="number" min="1" value="1" />

    <button onclick="addTask()">إضافة</button>
  </div>

  <div id="taskList"></div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function saveTasks() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function addTask() {
  const text = document.getElementById("taskInput").value;
  const type = document.getElementById("taskType").value;
  const repeat = parseInt(document.getElementById("repeatCount").value) || 1;

  if (!text) return;

  tasks.push({
    text,
    type,
    repeat,
    progress: Array(repeat).fill(false),
    lastReset: new Date().toDateString()
  });

  document.getElementById("taskInput").value = "";

  saveTasks();
  renderTasks();
}

function shouldReset(task) {
  const now = new Date();
  const last = new Date(task.lastReset);

  if (task.type === "daily") {
    return now.toDateString() !== last.toDateString();
  }

  if (task.type === "weekly") {
    return now.getWeek !== last.getWeek;
  }

  if (task.type === "monthly") {
    return now.getMonth() !== last.getMonth();
  }

  if (task.type === "yearly") {
    return now.getFullYear() !== last.getFullYear();
  }

  return false;
}

function resetIfNeeded(task) {
  if (shouldReset(task)) {
    task.progress = Array(task.repeat).fill(false);
    task.lastReset = new Date().toDateString();
  }
}

function renderTasks() {
  const list = document.getElementById("taskList");
  list.innerHTML = "";

  tasks.forEach((task, index) => {

    resetIfNeeded(task);

    const div = document.createElement("div");
    div.className = "task";

    let checks = "";

    task.progress.forEach((done, i) => {
      checks += `
        <input type="checkbox"
          ${done ? "checked" : ""}
          onchange="toggleProgress(${index}, ${i})"
        />
      `;
    });

    div.innerHTML = `
      <div>
        <strong>${task.text}</strong>
        <div class="checks">${checks}</div>
      </div>
      <button class="delete" onclick="deleteTask(${index})">🗑</button>
    `;

    list.appendChild(div);
  });

  saveTasks();
}

function toggleProgress(taskIndex, repeatIndex) {
  tasks[taskIndex].progress[repeatIndex] =
    !tasks[taskIndex].progress[repeatIndex];

  saveTasks();
}

function deleteTask(index) {
  tasks.splice(index, 1);
  saveTasks();
  renderTasks();
}

renderTasks();
</script>

</body>
</html>
